name: Compilar mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Extrair o zip
        run: unzip -o ./*.zip

      - name: Compilar
        working-directory: rpg-craft-mod
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-rpg-v2-jar
          path: |
            rpg-craft-mod/build/libs/*.jar
            !rpg-craft-mod/build/libs/*-sources.jar
